# The converter itself: the same image `langgraph build` produces and
# `langgraph up` runs locally, with the pinned Node toolchain at /opt/s2p-sandbox
# that the four gates shell out to.
#
# Nothing here patches around a platform bug. CORE_API_GRPC_SIDECAR is a variable
# only LangSmith's serverless tier sets; unset, the image's entrypoint runs its
# bundled Go core in-process, which is the topology that has always worked
# locally. See docs/deploy.md §9 for why that sentence is the whole reason this
# directory exists.
#
# Secrets are NOT here. POSTGRES_URI, REDIS_URI, LANGSMITH_API_KEY and the model
# keys are set with `fly secrets set`, which keeps them out of the repository and
# out of any image layer — the same reason .dockerignore excludes .env.

app = "s2p"
primary_region = "iad"

[build]
  # Generated by `langgraph dockerfile` (deploy.sh regenerates it every time, so
  # langgraph.json stays the single source of truth for the image). Built on
  # Fly's remote builder rather than this laptop: Fly machines are x86_64 and
  # this Mac is arm64, and cross-building `npm ci` under QEMU takes tens of
  # minutes. The remote builder is native amd64.
  dockerfile = "Dockerfile.generated"

[env]
  PORT = "8000"
  # The toolchain the gates run. Baked into the image at this path because the
  # directory a repository is cloned into is not something an image can know.
  S2P_SANDBOX = "/opt/s2p-sandbox"

  # The day's ceiling, in dollars, because dollars are what the card is billed
  # in and the run count is derived from them ($5.40 / $0.12 per run = 45).
  # Setting the runs directly would leave every "$5/day" string on the page
  # saying something the meter no longer means.
  S2P_DAILY_BUDGET_USD = "5.40"

  # How many conversions one visitor may spend in a day. A suite is metered per
  # file and charged in full before any model runs, so this is also the largest
  # suite this deployment will convert on the demo's own card: twelve is the
  # sample suite exactly. A folder bigger than this is refused whole rather than
  # converted in part — a half-converted suite is not a result anybody can use.
  # Bigger repos are for the visitor's own API key.
  #
  # It must be set on BOTH apps: the graph charges by this number and the UI
  # quotes it before the run. One without the other is a page that promises a
  # folder the backend will refuse.
  S2P_DAILY_LIMIT = "12"

[http_service]
  internal_port = 8000
  force_https = true
  # A conversion takes minutes and holds run state in memory while it works.
  # Scaling to zero between requests would kill one mid-flight, so the machine
  # stays up. This is the difference between a demo that works when someone
  # opens it and one that works when someone opens it twice.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/ok"

[[vm]]
  # Dedicated, not shared. A suite run is a burst of `tsc` processes — one per
  # file per attempt, each a cold compiler start — and on shared-cpu-1x that
  # burst exhausts the CPU credit and drops to the throttled baseline partway
  # through. The symptom is a run that gets *slower* as it goes: gaps between
  # model calls grew 68s → 98s → 103s → 140s on a four-file suite, and the page
  # sat on "0/4" for nine minutes before the run wedged entirely. A dedicated
  # core has no credit to exhaust, so the last wave costs what the first did.
  size = "performance-1x"
  # 2 GB, not 1: the gates run tsc and ESLint over the generated project, and a
  # TypeScript compile is the memory-hungriest thing this service does.
  memory = "2gb"
