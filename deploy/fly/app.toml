# The converter itself: the same image `langgraph build` produces and
# `langgraph up` runs locally, with the pinned Node toolchain at /opt/s2p-sandbox
# that the four gates shell out to.
#
# Nothing here patches around a platform bug. CORE_API_GRPC_SIDECAR is a variable
# only LangSmith's serverless tier sets; unset, the image's entrypoint runs its
# bundled Go core in-process, which is the topology that has always worked
# locally. See docs/deploy.md §9 for why that sentence is the whole reason this
# directory exists.
#
# Secrets are NOT here. POSTGRES_URI, REDIS_URI, LANGSMITH_API_KEY and the model
# keys are set with `fly secrets set`, which keeps them out of the repository and
# out of any image layer — the same reason .dockerignore excludes .env.

app = "s2p"
primary_region = "iad"

[build]
  # Generated by `langgraph dockerfile` (deploy.sh regenerates it every time, so
  # langgraph.json stays the single source of truth for the image). Built on
  # Fly's remote builder rather than this laptop: Fly machines are x86_64 and
  # this Mac is arm64, and cross-building `npm ci` under QEMU takes tens of
  # minutes. The remote builder is native amd64.
  dockerfile = "Dockerfile.generated"

[env]
  PORT = "8000"
  # The toolchain the gates run. Baked into the image at this path because the
  # directory a repository is cloned into is not something an image can know.
  S2P_SANDBOX = "/opt/s2p-sandbox"

[http_service]
  internal_port = 8000
  force_https = true
  # A conversion takes minutes and holds run state in memory while it works.
  # Scaling to zero between requests would kill one mid-flight, so the machine
  # stays up. This is the difference between a demo that works when someone
  # opens it and one that works when someone opens it twice.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/ok"

[[vm]]
  size = "shared-cpu-1x"
  # 2 GB, not 1: the gates run tsc and ESLint over the generated project, and a
  # TypeScript compile is the memory-hungriest thing this service does.
  memory = "2gb"
