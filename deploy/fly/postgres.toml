# Postgres for the deployed graphs — the checkpointer's threads and the store's
# memories both live here.
#
# This is `pgvector/pgvector:pg16`, the same image `langgraph up` uses locally,
# run as our own machine rather than a managed database. That is deliberate. The
# server's migrations create three extensions — vector, ltree and btree_gin —
# each guarded by `IF NOT EXISTS`, so they cost nothing when already present but
# need superuser when they are not. Fly's Managed Postgres offers only vector and
# PostGIS, so it would fail on ltree exactly the way LangSmith's managed Postgres
# failed on vector (docs/deploy.md §9). Running the container ourselves makes us
# superuser, and all three succeed.
#
# Not published to the internet: no [http_service], no public IP. Fly's private
# network reaches it at s2p-postgres.internal, which is why PGHOST must be the
# IPv6 wildcard rather than 127.0.0.1 — a process bound to loopback is invisible
# to the other machines in the org.

app = "s2p-postgres"
primary_region = "iad"

[build]
  image = "pgvector/pgvector:pg16"

[env]
  POSTGRES_DB = "postgres"
  POSTGRES_USER = "postgres"
  PGDATA = "/var/lib/postgresql/data/pgdata"

[mounts]
  source = "s2p_pgdata"
  destination = "/var/lib/postgresql/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Deliberately no [[services]] block. A services section is how a machine asks
# Fly for public ingress, and Fly answers by allocating public v4 and v6
# addresses — which it did, the first time this file had one. Private
# networking needs none of that: any port a machine listens on is reachable at
# <app>.internal over 6PN, services or not. So the database has no public
# address at all, which is the only version of "not on the internet" worth
# claiming.
#
# Autostop is a property of services too, so removing the block also removes the
# thing that could stop this machine. It stays up, which is what a database
# holding a connection pool mid-conversion needs to do.
