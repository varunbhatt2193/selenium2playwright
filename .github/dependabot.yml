version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # These are declared as devDependencies, but the deployed validators use
  # them at runtime. Keep them in dependency monitoring and update proposals.
  - package-ecosystem: npm
    directory: /sandbox
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      sandbox-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /samples
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      samples-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
