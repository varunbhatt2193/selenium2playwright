version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # These are declared as devDependencies, but the deployed validators use
  # them at runtime. Keep them in dependency monitoring and update proposals.
  - package-ecosystem: npm
    directory: /sandbox
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      sandbox-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /samples
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      samples-minor-patch:
        update-types: [minor, patch]

  # The playground page. Unlike the two above, these dependencies are bundled
  # and shipped to every visitor's browser, so a known flaw here is one the
  # public site serves.
  - package-ecosystem: npm
    directory: /ui/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      playground-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
