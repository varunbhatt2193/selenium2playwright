version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # These are declared as devDependencies, but the deployed validators use
  # them at runtime. Keep them in dependency monitoring and update proposals.
  - package-ecosystem: npm
    directory: /sandbox
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      sandbox-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /samples
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      samples-minor-patch:
        update-types: [minor, patch]

  # The playground page. Unlike the two above, these dependencies are bundled
  # and shipped to every visitor's browser, so a known flaw here is one the
  # public site serves.
  - package-ecosystem: npm
    directory: /ui/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # First, so it wins regardless of update type. vite and its React plugin
      # each declare a peer range on the other, so a major of one on its own
      # cannot install at all — npm fails at ERESOLVE before anything is built.
      # Proposed apart they are two pull requests that can never go green.
      vite:
        patterns: ["vite", "@vitejs/*"]
      playground-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
