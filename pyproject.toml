[project]
name = "selenium2playwright"
version = "0.1.0"
description = "LangGraph agent that converts TypeScript Selenium suites to Playwright, with compiler-verified output"
readme = "README.md"
authors = [{ name = "Varun Bhatt", email = "bhattvarunk@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langchain-openai>=1.6.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langsmith>=0.12.1",
    "openevals>=0.2.0",
    "python-dotenv>=1.2.3",
    "rich>=14",
    "typer>=0.16",
]

[project.scripts]
s2p = "selenium2playwright.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
