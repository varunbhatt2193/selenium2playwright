[project]
name = "selenium2playwright"
version = "0.1.0"
description = "LangGraph agent that converts TypeScript Selenium suites to Playwright, with compiler-verified output"
readme = "README.md"
authors = [{ name = "Varun Bhatt", email = "bhattvarunk@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langchain-openai>=1.6.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langsmith>=0.12.1",
    "openevals>=0.2.0",
    "python-dotenv>=1.2.3",
    "redis>=5.0",
    "rich>=14",
    "typer>=0.16",
]

[project.scripts]
s2p = "selenium2playwright.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
]
# Step 10.3. The playground is a front end for a deployment, not part of the
# agent: `s2p convert` and the graph itself must never need Streamlit installed,
# so it is a group you opt into with `uv run --group ui streamlit run ui/app.py`.
ui = [
    "streamlit>=1.49",
    # The web playground (ui/server.py): a FastAPI server that streams the
    # graph's progress to a React page built in ui/web. Same group, because it
    # is the same job — a front end for a deployment, never part of the agent.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
